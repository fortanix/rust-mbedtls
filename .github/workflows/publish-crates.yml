name: Publish Crates

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      crate_name:
        description: 'Name of crate to be published'
        required: true
        type: string
permissions:
  contents: read

env:
  RUST_BACKTRACE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  crate_dry_run_publish:
    runs-on: ubuntu-24.04
    outputs:
      crate_name: ${{ steps.crate_name.outputs.crate_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            override: true
            profile: minimal
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake
          if [ -f mbedtls-sys/vendor/scripts/basic.requirements.txt ]; then
            sudo apt-get install -y python3-pip
            python3 -m pip install -r mbedtls-sys/vendor/scripts/basic.requirements.txt
          fi
      - name: Get name of crate to be published
        id: crate_name
        run: |
          if [[ -z "${{ inputs.crate_name }}" ]]; then
            # Extract the crate name from the GITHUB_REF environment variable
            # GITHUB_REF contains the GitHub reference (e.g., refs/tags/mbedtls-sys-auto_v3.5.0) associated with the event
            export CRATE_NAME=$(python3 -c "print('$GITHUB_REF'.split('/')[2].rsplit('_v', 1)[0])")
          else
            export CRATE_NAME="${{ inputs.crate_name }}"
          fi
          echo "crate_name=$CRATE_NAME" >> "$GITHUB_OUTPUT"
      - name: Dry-run crate publication
        run: |
          echo "Dry-running publication of crate: ${{ steps.crate_name.outputs.crate_name }}"
          cargo publish --dry-run --locked --package "${{ steps.crate_name.outputs.crate_name }}"

  crate_publish:
    needs: crate_dry_run_publish
    environment: "publish to crates.io"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
            toolchain: stable
            override: true
            profile: minimal
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake
          if [ -f mbedtls-sys/vendor/scripts/basic.requirements.txt ]; then
            sudo apt-get install -y python3-pip
            python3 -m pip install -r mbedtls-sys/vendor/scripts/basic.requirements.txt
          fi
      - name: Publish crate to crates.io
        run: |
          echo "Publishing crate: ${{ needs.crate_dry_run_publish.outputs.crate_name }}"
          cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}" --package "${{ needs.crate_dry_run_publish.outputs.crate_name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

